name: Deploy Telescan API

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-telescan-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uvx --from ruff==0.16.3 ruff check .
          uvx --from ruff==0.16.3 ruff format --check .

      - name: Type check
        run: uvx --from pyright==1.1.411 pyright

      - name: Test
        run: uv run pytest

      - name: Deployment failure-injection fixtures
        run: |
          bash -n ops/deploy-production.sh
          bash ops/test-deploy-production.sh

      - name: Build
        run: docker build --tag telescan-api:ci .

      - name: Checkout canonical legal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hiTechTeam/Telescan-info
          ref: main
          path: .canonical-legal
          persist-credentials: false

      - name: Verify legal source equality
        run: >-
          uv run python -m scripts.sync_legal_source
          --source .canonical-legal/legal/legal_documents.json
          --check

  deploy:
    name: Deploy to production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload immutable release
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          RELEASE_DIR=/home/ubuntu/telescan/.releases/Telescan-api/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "test ! -e '$RELEASE_DIR' && install -d -m 0750 '$RELEASE_DIR'"
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.git' \
            -e 'ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes' \
            ./ "$SERVER_USER@$SERVER_HOST:$RELEASE_DIR/"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "chmod -R a-w '$RELEASE_DIR' && sync -f '$RELEASE_DIR' && sync -f '/home/ubuntu/telescan/.releases/Telescan-api'"

      - name: Run durable production transaction
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "/usr/bin/bash /home/ubuntu/telescan/.releases/Telescan-api/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/ops/deploy-production.sh --apply --confirm DEPLOY_TELESCAN_API_WITH_ROLLBACK --deploy-id ${{ github.run_id }}-${{ github.run_attempt }} --release-dir /home/ubuntu/telescan/.releases/Telescan-api/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
