name: Deploy Telescan API

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: telescan-api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uvx --from ruff==0.16.3 ruff check .
          uvx --from ruff==0.16.3 ruff format --check .

      - name: Type check
        run: uvx --from pyright==1.1.411 pyright

      - name: Test
        run: uv run pytest

      - name: Build
        run: docker build --tag telescan-api:ci .

  deploy:
    name: Deploy to production
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Back up production database
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" <<'REMOTE'
          set -Eeuo pipefail
          test -f /etc/systemd/system/telescan-mongodb-backup.service
          sudo systemctl start telescan-mongodb-backup.service
          test "$(systemctl show telescan-mongodb-backup.service --property=Result --value)" = "success"
          test "$(systemctl show telescan-mongodb-backup.service --property=ExecMainStatus --value)" = "0"
          REMOTE

      - name: Upload release
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          TARGET_DIR=/home/ubuntu/telescan/Telescan-api

          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" "mkdir -p '$TARGET_DIR'"
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.git' \
            -e 'ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes' \
            ./ "$SERVER_USER@$SERVER_HOST:$TARGET_DIR/"

      - name: Deploy API
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/telescan/Telescan-api
          test -s .env
          docker compose config --quiet </dev/null

          PREVIOUS_CONTAINER_ID="$(docker compose ps -q telescan-api </dev/null)"
          test -n "$PREVIOUS_CONTAINER_ID"
          PREVIOUS_IMAGE_ID="$(docker inspect --format '{{.Image}}' "$PREVIOUS_CONTAINER_ID")"
          PREVIOUS_IMAGE_REF="$(docker inspect --format '{{.Config.Image}}' "$PREVIOUS_CONTAINER_ID")"

          docker compose build telescan-api </dev/null
          docker compose run --rm --no-deps -T telescan-api \
            /app/.venv/bin/python -m scripts.migrate_apple_auth </dev/null
          docker compose run --rm --no-deps -T telescan-api \
            /app/.venv/bin/python -m scripts.migrate_universal_reports </dev/null

          rollback_previous_release() {
            exit_status=$?
            if [ "$exit_status" -eq 0 ]; then
              return
            fi
            trap - EXIT
            set +e
            docker compose stop --timeout 30 telescan-api </dev/null
            docker tag "$PREVIOUS_IMAGE_ID" "$PREVIOUS_IMAGE_REF"
            docker compose up -d --no-deps --force-recreate telescan-api </dev/null
            docker compose ps telescan-api </dev/null
            exit "$exit_status"
          }
          trap rollback_previous_release EXIT

          docker compose stop --timeout 30 telescan-api </dev/null

          docker compose run --rm --no-deps -T telescan-api \
            /app/.venv/bin/python -m scripts.migrate_apple_auth \
            --apply --confirm MIGRATE_APPLE_AUTH </dev/null
          docker compose run --rm --no-deps -T telescan-api \
            /app/.venv/bin/python -m scripts.migrate_universal_reports \
            --apply --confirm MIGRATE_UNIVERSAL_REPORTS </dev/null

          docker compose up -d --no-deps telescan-api </dev/null
          CONTAINER_ID="$(docker compose ps -q telescan-api </dev/null)"
          test -n "$CONTAINER_ID"
          for attempt in {1..20}; do
            HEALTH_STATUS="$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_ID")"
            if [ "$HEALTH_STATUS" = "healthy" ]; then
              break
            fi
            sleep 5
          done
          docker compose ps telescan-api </dev/null
          test "$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_ID")" = "healthy"
          trap - EXIT
          REMOTE
