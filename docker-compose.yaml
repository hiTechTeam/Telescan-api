services:
  telescan-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telescan_api
    restart: unless-stopped
    deploy:
      replicas: 1
    ports:
      - '127.0.0.1:8000:8000'
    env_file:
      - .env
    environment:
      ENABLE_TELEGRAM_FIRST_AUTH: "true"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - type: bind
        source: /home/ubuntu/telescan/.runtime/Telescan-api
        target: /run/telescan-api-singleton
        bind:
          create_host_path: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --output
        - /dev/null
        - http://127.0.0.1:8000/health/ready
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - telescan_network

networks:
  telescan_network:
    driver: bridge
    external: true
