[project]
dependencies = [
  "aiobotocore>=2.26.0",
  "aiohttp>=3.14.3",
  "beanie>=2.0.0",
  "fastapi>=0.121.1",
  "orjson>=3.11.6",
  "pyjwt>=2.10.1",
  "pydantic-settings>=2.14.2",
  "pymongo>=4.15.4",
  "python-multipart>=0.0.20",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.3.0",
  "uvicorn>=0.38.0",
]
description = "Add your description here"
name = "telescan-api"
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.pyright]
include = ["main.py", "scripts", "src"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venv = ".venv"
venvPath = "."

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
